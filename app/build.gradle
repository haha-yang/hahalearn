plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-kapt'
    id 'org.jetbrains.kotlin.android'
    id 'com.haha.servicerouter.register'
}

android {
    namespace 'com.haha.hahalearn'
    compileSdkVersion rootProject.ext.compileSdkVersion
    buildToolsVersion "35.0.0"
    // NDK r28+ defaults to 16 KB ELF LOAD alignment (Play requirement for targetSdk 35+)
    ndkVersion "28.2.13676358"

//    configurations {
//        cleanedAnnotations
//        implementation.exclude group: 'org.jetbrains' , module:'annotations'
//        implementation.exclude group: 'com.intellij' , module:'annotations'
//    }

    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
        pickFirst 'lib/arm64-v8a/libc++_shared.so'
        pickFirst 'lib/arm64-v8a/libonnxruntime.so'
    }

    defaultConfig {
        applicationId "com.haha.hahalearn"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        multiDexEnabled true // 启用多DEX

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "int", "TARGET_SDK_VERSION", targetSdkVersion.mApiLevel.toString()
        buildConfigField "boolean", "IS_SHOW_SPLASH", false.toString()

        ndk {
            // Filter for architectures supported by Flutter
            // "armeabi-v7a",
            abiFilters "arm64-v8a"
        }

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["DOFROUTER_MODULE_NAME": project.getName()]
            }
        }
    }
    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    buildFeatures {
        viewBinding = true
        dataBinding = true
        buildConfig = true
        viewBinding true
//        aidl true
//        compose = true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
//    composeOptions {
//        kotlinCompilerExtensionVersion = "1.5.0"
//    }
    compileOptions {
        sourceCompatibility rootProject.ext.sourceCompatibility_javaVersion
        targetCompatibility rootProject.ext.targetCompatibility_javaVersion
    }
    kotlinOptions { // 如果使用Kotlin
        jvmTarget = rootProject.ext.jvmTarget_version
        freeCompilerArgs += ["-Xskip-metadata-version-check"]
    }
}

task createCoroutineExceptionHandlerServiceFile {
    doLast {
        // 定义服务文件所在目录
        def serviceDir = new File("$projectDir/src/main/resources/META-INF/services")
        // 创建目录（如果不存在）
        serviceDir.mkdirs()
        // 定义服务文件
        def serviceFile = new File(serviceDir, "kotlinx.coroutines.CoroutineExceptionHandler")
        // 写入全局异常处理器全类名
        serviceFile.text = "com.haha.HahaGlobalCoroutineExceptionHandler"
    }
}

// 让 assemble 任务依赖于创建文件的任务
assemble.dependsOn createCoroutineExceptionHandlerServiceFile

