plugins {
    id 'com.android.library'
    id 'kotlin-android'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.haha.speech'
    compileSdkVersion rootProject.ext.compileSdkVersion
    buildToolsVersion "35.0.0"

    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        consumerProguardFiles "consumer-rules.pro"
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility rootProject.ext.sourceCompatibility_javaVersion
        targetCompatibility rootProject.ext.targetCompatibility_javaVersion
    }
    kotlinOptions {
        jvmTarget = rootProject.ext.jvmTarget_version
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.annotation:annotation:1.7.1'
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
    implementation 'com.squareup.okhttp3:okhttp:4.9.1'
    implementation 'org.apache.commons:commons-compress:1.26.2'
    // 流式离线 ASR；JitPack 已在根 build.gradle 配置
    implementation 'com.github.k2-fsa.sherpa-onnx:sherpa-onnx:v1.13.5'

    testImplementation 'junit:junit:4.13.2'
}
