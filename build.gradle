// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
//    ext.kotlin_version = "1.9.22"
    ext.kotlin_version = "2.1.0"
    repositories {
        mavenLocal()
//        maven { url "https://maven.google.com" }
        // 配置Maven仓库地址，以提高依赖下载速度
        // 添加公共仓库的阿里云镜像，这个仓库包含了大量开源项目的发布版本
        maven { url 'https://maven.aliyun.com/repository/public' }
        // 添加中央仓库的阿里云镜像
        maven { url 'https://maven.aliyun.com/repository/central' }
        maven { url 'https://maven.aliyun.com/repository/google' }
        // 添加Gradle插件仓库的阿里云镜像，这个仓库主要用于Gradle插件的下载
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        // 添加Apache Snapshots仓库的阿里云镜像，这个仓库用于下载Apache项目的快照版本
        maven {
            url 'https://maven.aliyun.com/repository/apache-snapshots'
        }
        // 华为开发者仓库
        maven {
            url 'https://developer.huawei.com/repo/'
        }
        // 腾讯镜像仓库
        maven{
            url 'https://mirrors.tencent.com/nexus/repository/maven-public/'
        }
        // Jitpack仓库
        maven { url 'https://jitpack.io' }
//        google {
//            content {
//                includeGroupByRegex("com/.android.*")
//                includeGroupByRegex("com/.google.*")
//                includeGroupByRegex("androidx.*")
//            }
//        }
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
//        classpath "com.android.tools.build:gradle:8.3.0"
//        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22"
        classpath 'com.android.tools.build:gradle:8.13.1'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.0'
        classpath 'org.jetbrains.kotlin:compose-compiler-gradle-plugin:2.2.0'
        classpath 'org.jetbrains.compose:compose-gradle-plugin:1.8.2'
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "$rootDir/gradle/github-packages.gradle"

allprojects {
    repositories {
        mavenLocal()
        // GitHub Packages 充当私服（等同 Nexus maven-public）
        if (rootProject.ext.gprUser && rootProject.ext.gprKey) {
            maven {
                name = 'GitHubPackages'
                url = uri(rootProject.ext.gprMavenUrl)
                credentials {
                    username = rootProject.ext.gprUser
                    password = rootProject.ext.gprKey
                }
            }
        }
//        maven { url "https://maven.google.com" }
        // 配置Maven仓库地址，以提高依赖下载速度
        // 添加公共仓库的阿里云镜像，这个仓库包含了大量开源项目的发布版本
        maven { url 'https://maven.aliyun.com/repository/public' }
        // 添加中央仓库的阿里云镜像
        maven { url 'https://maven.aliyun.com/repository/central' }
        maven { url 'https://maven.aliyun.com/repository/google' }
        // 添加Gradle插件仓库的阿里云镜像，这个仓库主要用于Gradle插件的下载
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        // 添加Apache Snapshots仓库的阿里云镜像，这个仓库用于下载Apache项目的快照版本
        maven {
            url 'https://maven.aliyun.com/repository/apache-snapshots'
        }
        // 华为开发者仓库
        maven {
            url 'https://developer.huawei.com/repo/'
        }
        // 腾讯镜像仓库
        maven{
            url 'https://mirrors.tencent.com/nexus/repository/maven-public/'
        }
        // Jitpack仓库
        maven { url 'https://jitpack.io' }
//        google {
//            content {
//                includeGroupByRegex("com/.android.*")
//                includeGroupByRegex("com/.google.*")
//                includeGroupByRegex("androidx.*")
//            }
//        }
        google()
        mavenCentral()
        gradlePluginPortal()
    }

//    configurations.all {
//        resolutionStrategy {
//            force 'androidx.activity:activity:1.8.0'
//        }
//    }
}

ext {
    compileSdkVersion = 36
    buildToolsVersion = "35.0.0"
    minSdkVersion = 24
    targetSdkVersion = 36
    sourceCompatibility_javaVersion = JavaVersion.VERSION_17
    targetCompatibility_javaVersion = JavaVersion.VERSION_17
    jvmTarget_version = "17"
}

tasks.register('clean', Delete) {
    delete rootProject.getLayout().buildDirectory
}