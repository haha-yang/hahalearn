plugins {
    id 'com.android.library'
    id 'kotlin-android'
    id 'kotlin-kapt'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.haha.serviceImpl'
    compileSdkVersion rootProject.ext.compileSdkVersion

    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility rootProject.ext.sourceCompatibility_javaVersion
        targetCompatibility rootProject.ext.targetCompatibility_javaVersion
    }
    kotlinOptions {
        jvmTarget = rootProject.ext.jvmTarget_version
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation project(':ServiceAnnotation')
    implementation project(':lib-contract')
    implementation project(':ServiceRuntime')
    kapt project(':ServiceAnnotationProcessor')
}

kapt {
    arguments {
        arg("SERVICE_MODULE_NAME", project.getName())
    }
}