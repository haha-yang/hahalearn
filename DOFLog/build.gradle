plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-android'
    id 'maven-publish'
}

ext {
    PUBLISH_GROUP = 'com.haha'
    PUBLISH_ARTIFACT = 'doflog'
    PUBLISH_VERSION = '1.0.0'
}

android {
    namespace 'com.haha.log'
    compileSdkVersion rootProject.ext.compileSdkVersion

    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    publishing {
        multipleVariants("release") {
            includeBuildTypeValues("release")
            withSourcesJar()
        }
        multipleVariants("debug") {
            includeBuildTypeValues("debug")
            withSourcesJar()
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility rootProject.ext.sourceCompatibility_javaVersion
        targetCompatibility rootProject.ext.targetCompatibility_javaVersion
    }
    kotlinOptions {
        jvmTarget = rootProject.ext.jvmTarget_version
    }
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = PUBLISH_GROUP
                artifactId = PUBLISH_ARTIFACT
                version = PUBLISH_VERSION
                pom {
                    name = 'DOFLog'
                    description = 'HahaLearn unified Android logger (release)'
                    url = 'https://github.com/haha-yang/hahalearn'
                }
            }
            debug(MavenPublication) {
                from components.debug
                groupId = PUBLISH_GROUP
                artifactId = PUBLISH_ARTIFACT
                // SNAPSHOT 可反复覆盖；正式版 1.0.0 不可覆盖
                version = "${PUBLISH_VERSION}-SNAPSHOT"
                pom {
                    name = 'DOFLog'
                    description = 'HahaLearn unified Android logger (debug / maven-snapshots)'
                    url = 'https://github.com/haha-yang/hahalearn'
                }
            }
        }
        repositories {
            mavenLocal()
            maven {
                name = 'GitHubPackages'
                url = uri(rootProject.ext.gprMavenUrl)
                credentials {
                    username = rootProject.ext.gprUser
                    password = rootProject.ext.gprKey
                }
            }
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.annotation:annotation-jvm:1.9.1'
    implementation 'androidx.core:core-ktx:1.10.0'
    implementation 'com.blankj:utilcode:1.30.7'
}
